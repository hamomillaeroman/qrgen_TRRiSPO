apiVersion: apps/v1
kind: Deployment
metadata:
  name: qrgen
  namespace: qrgen
spec:
  replicas: 2
  selector:
    matchLabels:
      app: qrgen
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: qrgen
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - name: app
        image: hamomillaeroman/qrgen:1.0.1
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: qrgen-config
        - secretRef:
            name: qrgen-secret
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10

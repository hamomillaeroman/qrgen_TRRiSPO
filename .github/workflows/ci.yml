name: ci
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && xargs -a build-deps.txt sudo apt-get install -y && sudo apt-get install -y cppcheck
      - run: cmake -S . -B build -DCMAKE_C_FLAGS=-Werror -DBUILD_TESTING=OFF
      - run: cmake --build build
      - run: cppcheck --enable=warning,style,performance --error-exitcode=1 -q src

  test:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && xargs -a build-deps.txt sudo apt-get install -y && sudo apt-get install -y gcovr
      
      - name: Build and Test with Coverage
        run: |
          rm -rf build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON
          cmake --build build
          ctest --test-dir build --output-on-failure --output-junit junit.xml
          
 - name: Check Coverage
        run: gcovr -r . --filter ".*core\.c" --fail-under-line 70

      - name: Build and Test with Sanitizers
        run: |
          rm -rf build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-fsanitize=address,undefined" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build
          export ASAN_OPTIONS=detect_leaks=0
          ctest --test-dir build --output-on-failure

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: build/junit.xml

  package:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && xargs -a build-deps.txt sudo apt-get install -y && sudo apt-get install -y dpkg-dev lintian
      - run: chmod +x build_deb.sh && ./build_deb.sh
      - run: lintian --fail-on error dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb
 release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist
      - run: gh release create "${{ github.ref_name }}" dist/*.deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
